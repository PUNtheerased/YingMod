<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" font-family="Kanit, Tahoma, sans-serif">
  <rect width="240" height="180" rx="16" fill="#0b1033"/>
  <!-- light bulb -->
  <g transform="translate(120 32)">
    <g stroke="#ffd166" stroke-width="2" stroke-linecap="round">
      <line x1="-20" y1="0" x2="-15" y2="0"/><line x1="15" y1="0" x2="20" y2="0"/>
      <line x1="0" y1="-20" x2="0" y2="-15"/><line x1="-14" y1="-14" x2="-10" y2="-10"/><line x1="14" y1="-14" x2="10" y2="-10"/>
    </g>
    <circle r="10" fill="#ffd166"/>
    <rect x="-5" y="9" width="10" height="7" rx="2" fill="#9aa4c8"/>
  </g>
  <text x="96" y="66" fill="#ffd166" font-size="11">&#xe41;&#xe2a;&#xe07;&#xe2a;&#xe27;&#xe48;&#xe32;&#xe07;&#xe1e;&#xe2d;</text>
  <!-- monitor with webcam -->
  <rect x="16" y="56" width="66" height="50" rx="6" fill="#1b2350" stroke="#3df5ff" stroke-width="2"/>
  <circle cx="49" cy="63" r="3.5" fill="#ff3b5c"/>
  <rect x="43" y="106" width="12" height="12" fill="#3a4a9a"/>
  <rect x="31" y="118" width="36" height="5" rx="2" fill="#3a4a9a"/>
  <text x="26" y="90" fill="#e0fbfc" font-size="11">&#xe01;&#xe25;&#xe49;&#xe2d;&#xe07;</text>
  <!-- distance -->
  <g stroke="#3df5ff" stroke-width="2" fill="#3df5ff">
    <line x1="88" y1="140" x2="150" y2="140" stroke-dasharray="5 4"/>
    <path d="M84 140 L94 134 L94 146 Z" stroke="none"/>
    <path d="M154 140 L144 134 L144 146 Z" stroke="none"/>
  </g>
  <text x="90" y="160" fill="#3df5ff" font-size="14" font-weight="bold">50&#x2013;80 &#xe0b;&#xe21;.</text>
  <!-- person -->
  <path d="M160 176 Q160 120 192 116 Q224 120 224 176 Z" fill="#3a4a9a"/>
  <circle cx="192" cy="92" r="20" fill="#f6c7a1" stroke="#6b3f22" stroke-width="2"/>
  <path d="M172 88 Q176 66 196 70 Q214 72 212 88 Q206 76 192 78 Q180 78 172 88 Z" fill="#2b1d14"/>
  <!-- raised hand (finger gun) -->
  <path d="M168 132 L158 102" stroke="#3a4a9a" stroke-width="9" stroke-linecap="round"/>
  <g fill="#f6c7a1" stroke="#6b3f22" stroke-width="1.5">
    <rect x="148" y="84" width="18" height="22" rx="6"/>
    <rect x="150" y="66" width="7" height="24" rx="3.5"/>
    <rect x="142" y="76" width="7" height="18" rx="3.5" transform="rotate(-16 145 92)"/>
  </g>
</svg>
