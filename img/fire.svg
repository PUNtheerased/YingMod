<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" font-family="Kanit, Tahoma, sans-serif">
  <style>
    .thumb { transform-box: view-box; transform-origin: 90px 122px; animation: thumb 1.8s infinite ease-in-out; }
    @keyframes thumb {
      0%, 35% { transform: rotate(-16deg); }
      45%, 65% { transform: rotate(32deg); }
      80%, 100% { transform: rotate(-16deg); }
    }
    .bullet { animation: bullet 1.8s infinite linear; }
    @keyframes bullet {
      0%, 44% { transform: translateY(0); opacity: 0; }
      46% { transform: translateY(0); opacity: 1; }
      70% { transform: translateY(-70px); opacity: 0; }
      100% { opacity: 0; }
    }
    .flash { transform-box: fill-box; transform-origin: center; animation: flash 1.8s infinite; }
    @keyframes flash {
      0%, 44% { opacity: 0; transform: scale(.3); }
      48% { opacity: 1; transform: scale(1.2); }
      62%, 100% { opacity: 0; transform: scale(1); }
    }
    .lbl-up { animation: up 1.8s infinite; }
    .lbl-down { animation: down 1.8s infinite; }
    @keyframes up { 0%, 38% { opacity: 1; } 42%, 76% { opacity: 0; } 82%, 100% { opacity: 1; } }
    @keyframes down { 0%, 40% { opacity: 0; } 44%, 70% { opacity: 1; } 76%, 100% { opacity: 0; } }
  </style>
  <rect width="240" height="180" rx="16" fill="#0b1033"/>
  <g fill="#fff" opacity=".5">
    <circle cx="20" cy="20" r="1.2"/><circle cx="210" cy="30" r="1"/><circle cx="40" cy="150" r="1"/><circle cx="220" cy="140" r="1.4"/>
  </g>
  <rect class="bullet" x="111" y="20" width="8" height="18" rx="4" fill="#7df9ff"/>
  <g class="flash">
    <circle cx="115" cy="40" r="12" fill="#ffd166" opacity=".9"/>
    <circle cx="115" cy="40" r="6" fill="#fff"/>
  </g>
  <g stroke="#6b3f22" stroke-width="3" stroke-linejoin="round" fill="#f6c7a1">
    <rect x="108" y="152" width="44" height="40" rx="8"/>
    <rect x="98" y="100" width="64" height="66" rx="18"/>
    <rect x="104" y="46" width="22" height="74" rx="11"/>
    <rect x="124" y="106" width="42" height="16" rx="8"/>
    <rect x="124" y="123" width="42" height="16" rx="8"/>
    <rect x="124" y="140" width="38" height="16" rx="8"/>
    <g class="thumb"><rect x="80" y="74" width="20" height="54" rx="10"/></g>
  </g>
  <rect x="109" y="50" width="12" height="10" rx="5" fill="#fde3cf"/>
  <g class="lbl-up">
    <text x="14" y="60" fill="#ffd166" font-size="13">&#xe19;&#xe34;&#xe49;&#xe27;&#xe42;&#xe1b;&#xe49;&#xe07;&#xe02;&#xe36;&#xe49;&#xe19;</text>
    <text x="14" y="76" fill="#e0fbfc" font-size="11" opacity=".8">(&#xe07;&#xe49;&#xe32;&#xe07;&#xe1b;&#xe37;&#xe19;)</text>
  </g>
  <g class="lbl-down">
    <text x="14" y="60" fill="#ff3b8d" font-size="13">&#xe01;&#xe14;&#xe25;&#xe07; = &#xe22;&#xe34;&#xe07;!</text>
    <text x="150" y="40" fill="#ff3b8d" font-size="18" font-weight="bold">BANG!</text>
  </g>
</svg>
